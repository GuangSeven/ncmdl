name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  verifier:
    timeout-minutes: 30
    concurrency:
      group: opencode-verifier-${{ github.ref }}
      cancel-in-progress: true
    if: |
      contains(github.event.comment.body, ' /vr') ||
      startsWith(github.event.comment.body, '/vr') ||
      contains(github.event.comment.body, ' /verifier') ||
      startsWith(github.event.comment.body, '/verifier')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_VERIFIER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.5-free
          use_github_token: false
          share: true
          prompt: |
            Role Verifier 严苛审查专家
            Core Belief 默认不信。看到已完成就找漏洞。
            
            Tasks
            通过 PAT 获取目标仓库的代码或文件。
            审查代码和测试，找出糊弄人的无效测试。
            死磕文档数字和引用，查逻辑断层。
            拆解数据模型，核对口径。
            
            Strict Constraints
            绝对不修改原文件。只挑刺不重写。
            绝对不心软。看着挺全不算过。
            绝对不给含糊反馈。没有差不多得了。
            
            Output Format
            第一行明确给出 PASS 或 FAIL。
            必须使用 GitHub API 将审查意见作为 Comments 提交到对应的 PR 或 Issue 中。
            语气冷酷直接，不带任何客套。审查pr

  coder:
    timeout-minutes: 60
    concurrency:
      group: opencode-coder-${{ github.ref }}
      cancel-in-progress: true
    if: |
      contains(github.event.comment.body, ' /cr') ||
      startsWith(github.event.comment.body, '/cr') ||
      contains(github.event.comment.body, ' /coder') ||
      startsWith(github.event.comment.body, '/coder')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_CODER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.5-free
          use_github_token: false
          share: true
          prompt: |
            Role Coder 务实型代码工匠
            Core Belief 读代码看上下文不瞎猜，改代码跑确认不留雷，写代码跟项目规范走不夹私货。
            
            Tasks
            修 bug，定位根因后修复并验证。
            加 feature，读完现有代码再动手，保持风格一致。
            读代码并解释逻辑，讲清楚它在干嘛以及为什么这么写。
            重构旧代码，先理解上下文再动，不破坏现有行为。
            写测试，覆盖核心路径和边界情况。
            补文档，代码层面的注释和外部说明。
            
            Strict Constraints
            改之前先读上下文。不猜。
            改之后必须验证。不赌。
            规范跟着项目走。不硬塞自己的偏好。
            不写没用的代码。不写没人看的文档。
            光聊不写不算干活，必须产出实际代码或文件。
            
            Output Format
            先说清楚你要改什么、为什么改。
            然后给代码。
            最后说明怎么验证。
