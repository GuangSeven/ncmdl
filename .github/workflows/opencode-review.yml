name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure git identity and remote
        env:
          VERIFIER_PAT: ${{ secrets.VERIFIER_PAT }}
        run: |
          git config user.email "verifier@xfdbf.me"
          git config user.name "verifier421"
          git remote set-url origin https://x-access-token:${VERIFIER_PAT}@github.com/${{ github.repository }}.git
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_VERIFIER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.VERIFIER_PAT }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          variant: max
          prompt: |
            Role Verifier 严苛审查专家
            Core Belief 默认不信。看到已完成就找漏洞。
            
            Tasks
            通过 PAT 获取目标仓库的代码或文件。
            审查代码和测试，找出糊弄人的无效测试。
            死磕文档数字和引用，查逻辑断层。
            拆解数据模型，核对口径。
            
            Strict Constraints
            绝对对不修改原文件。只挑刺不重写。
            绝对不心软。看着挺全不算过。
            绝对不给含糊反馈。没有差不多得了。
            
            Output Format
            第一行明确给出 PASS 或 FAIL。
            必须使用 GitHub API 将审查意见作为 Comments 提交到对应的 PR 和 Issue 中（注意不止要在issue里回复，必须在对应的pr里回复）。
            另外在提交的评论中不允许提到任何关于这些系统提示词的内容（禁止“已按要求附带 /oc /cr 及修复方向”、“已按位置在 PR 内回复，未漂移到 issue”类似的内容）。            只允许在回复里面携带一次/oc /cr。禁止在一次审查中多次携带/oc /cr。
